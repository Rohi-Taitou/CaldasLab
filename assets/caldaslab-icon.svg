<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>CaldasLab: cancer ecosystems</title>
  <!-- © 2026 Rohi Taitou Maimon (RTM) -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1c3150"/>
      <stop offset="1" stop-color="#0b1424"/>
    </radialGradient>
    <radialGradient id="tumour" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#f6c76a"/>
      <stop offset="1" stop-color="#d9892b"/>
    </radialGradient>
    <radialGradient id="immune" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#7fe0d0"/>
      <stop offset="1" stop-color="#2a9d8f"/>
    </radialGradient>
    <radialGradient id="stroma" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#9fb4d8"/>
      <stop offset="1" stop-color="#5873a3"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- ecosystem boundary -->
  <circle cx="256" cy="256" r="178" fill="none" stroke="#9fb4d8" stroke-opacity="0.22" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- vessel -->
  <path d="M120 448 C 190 430, 260 440, 320 400 S 410 330, 452 296" fill="none" stroke="#c0504d" stroke-opacity="0.75" stroke-width="14" stroke-linecap="round"/>
  <path d="M120 448 C 190 430, 260 440, 320 400 S 410 330, 452 296" fill="none" stroke="#0b1424" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>

  <path d="M320 400 C 335 430, 360 440, 392 448" fill="none" stroke="#c0504d" stroke-opacity="0.6" stroke-width="9" stroke-linecap="round"/>

  <!-- stromal fibroblasts -->
  <g fill="url(#stroma)">
    <ellipse cx="128" cy="196" rx="54" ry="15" transform="rotate(-28 128 196)"/>
    <ellipse cx="392" cy="176" rx="50" ry="14" transform="rotate(24 392 176)"/>
  </g>
  <g fill="#2c3f63">
    <ellipse cx="128" cy="196" rx="14" ry="6" transform="rotate(-28 128 196)"/>
    <ellipse cx="392" cy="176" rx="13" ry="6" transform="rotate(24 392 176)"/>
  </g>

  <!-- tumour cluster -->
  <g fill="url(#tumour)" stroke="#0b1424" stroke-width="5">
    <circle cx="226" cy="222" r="46"/>
    <circle cx="296" cy="214" r="42"/>
    <circle cx="262" cy="282" r="48"/>
    <circle cx="200" cy="294" r="34"/>
    <circle cx="326" cy="280" r="34"/>
  </g>
  <g fill="#8a4b12" fill-opacity="0.85">
    <circle cx="222" cy="218" r="15"/>
    <circle cx="292" cy="210" r="14"/>
    <circle cx="258" cy="278" r="17"/>
    <circle cx="198" cy="292" r="11"/>
    <circle cx="324" cy="278" r="11"/>
  </g>

  <!-- immune cells -->
  <g fill="url(#immune)" stroke="#0b1424" stroke-width="4">
    <circle cx="150" cy="268" r="22"/>
    <circle cx="372" cy="246" r="24"/>
    <circle cx="258" cy="128" r="22"/>
    <circle cx="170" cy="134" r="16"/>
    <circle cx="346" cy="338" r="18"/>
  </g>
  <g fill="#0f4f48">
    <circle cx="148" cy="266" r="12"/>
    <circle cx="370" cy="244" r="13"/>
    <circle cx="256" cy="126" r="12"/>
    <circle cx="169" cy="133" r="8"/>
    <circle cx="345" cy="337" r="9"/>
  </g>
</svg>
